[project]
name = "bunnyland-studio"
version = "0.1.0"
description = "Exclusive-influence autonomous Van Waifu studio addon for Bunnyland."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Thalis Mind" },
]
keywords = [
    "bunnyland",
    "ecs",
    "plugin",
    "simulation",
    "studio",
    "travel",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Simulation",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "bunnyland[server]>=1.0.0,<2",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "relics-ecs>=0.1.1,<0.2",
]

[project.urls]
Documentation = "https://github.com/thalismind/bunnyland-studio#readme"
Issues = "https://github.com/thalismind/bunnyland-studio/issues"
Repository = "https://github.com/thalismind/bunnyland-studio"

[project.entry-points."bunnyland.plugins"]
"bunnyland.studio" = "bunnyland_studio.plugin:bunnyland_plugins"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.uv.sources]
bunnyland = { path = "../../bunnyland-server" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bunnyland_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
