[project]
name = "bunnyland-studio"
version = "0.1.0"
description = "Exclusive-influence autonomous Van Waifu studio addon for Bunnyland."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.15"
dependencies = [
    "bunnyland[server]>=1.0.0,<2",
    "httpx2>=0.28.1",
    "pydantic>=2.0",
    "relics-ecs>=0.1.1,<0.2",
]

[project.entry-points."bunnyland.plugins"]
"bunnyland.studio" = "bunnyland_studio.plugin:bunnyland_plugins"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.uv.sources]
bunnyland = { path = "../../bunnyland-server" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bunnyland_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
