name: Release containers

on:
  workflow_dispatch:
    inputs:
      server_image:
        description: Immutable Bunnyland Server image (ghcr.io/thalismind/bunnyland-server@sha256:...)
        required: true
        type: string
      web_image:
        description: Immutable Bunnyland Web image (ghcr.io/thalismind/bunnyland-web@sha256:...)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate immutable bases
    runs-on: ubuntu-latest
    steps:
      - name: Reject mutable or foreign base images
        env:
          SERVER_IMAGE: ${{ inputs.server_image }}
          WEB_IMAGE: ${{ inputs.web_image }}
        run: |
          [[ "$SERVER_IMAGE" =~ ^ghcr\.io/thalismind/bunnyland-server@sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_IMAGE" =~ ^ghcr\.io/thalismind/bunnyland-web@sha256:[0-9a-f]{64}$ ]]

  server:
    name: Studio server image
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bunnyland-studio-server
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,format=long
      - id: build
        name: Build and publish exact Studio server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.server
          build-args: BUNNYLAND_SERVER_IMAGE=${{ inputs.server_image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Scan exact Studio server image
        uses: anchore/scan-action@v7.4.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/bunnyland-studio-server@${{ steps.build.outputs.digest }}
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          by-cve: true

  web:
    name: Studio web image
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bunnyland-studio-web
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,format=long
      - id: build
        name: Build and publish exact Studio web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          build-args: BUNNYLAND_WEB_IMAGE=${{ inputs.web_image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Scan exact Studio web image
        uses: anchore/scan-action@v7.4.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/bunnyland-studio-web@${{ steps.build.outputs.digest }}
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          by-cve: true

  summary:
    name: Record immutable digests
    needs: [server, web]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release summary
        env:
          SERVER_DIGEST: ${{ needs.server.outputs.digest }}
          WEB_DIGEST: ${{ needs.web.outputs.digest }}
        run: |
          [[ "$SERVER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo '## Bunnyland Studio images'
            echo
            echo "- Server: \`ghcr.io/thalismind/bunnyland-studio-server@$SERVER_DIGEST\`"
            echo "- Web: \`ghcr.io/thalismind/bunnyland-studio-web@$WEB_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
